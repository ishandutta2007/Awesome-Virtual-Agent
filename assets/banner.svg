<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#161233" />
    </linearGradient>

    <linearGradient id="primaryTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.85)" />
    </linearGradient>

    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <linearGradient id="pillGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <linearGradient id="pillGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>

    <linearGradient id="pillGrad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <radialGradient id="orbGlow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orbGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.15); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1.5deg); }
      }
      @keyframes waveSlide {
        0% { transform: translateX(0); }
        100% { transform: translateX(-640px); }
      }
      @keyframes nodePulse {
        0%, 100% { r: 3; opacity: 0.4; }
        50% { r: 5; opacity: 0.9; }
      }
      .anim-glow1 {
        animation: pulseGlow 7s ease-in-out infinite;
        transform-origin: 200px 100px;
      }
      .anim-glow2 {
        animation: pulseGlow 9s ease-in-out infinite 3s;
        transform-origin: 1080px 240px;
      }
      .anim-wave {
        animation: waveSlide 18s linear infinite;
      }
      .anim-node {
        animation: nodePulse 3s ease-in-out infinite;
      }
      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1280" height="360" fill="url(#bgGrad)" />

  <!-- DYNAMIC / ANIMATED BACKGROUND ELEMENTS (Strictly strictly kept in background) -->
  <g id="dynamic-background-elements">
    <!-- Ambient Pulsing Glow Orbs -->
    <circle cx="200" cy="100" r="180" fill="url(#orbGlow1)" class="anim-glow1" />
    <circle cx="1080" cy="240" r="220" fill="url(#orbGlow2)" class="anim-glow2" />

    <!-- Technical Grid Accent -->
    <g opacity="0.12" stroke="#60a5fa" stroke-width="0.8">
      <line x1="80" y1="0" x2="80" y2="360" />
      <line x1="240" y1="0" x2="240" y2="360" />
      <line x1="400" y1="0" x2="400" y2="360" />
      <line x1="560" y1="0" x2="560" y2="360" />
      <line x1="720" y1="0" x2="720" y2="360" />
      <line x1="880" y1="0" x2="880" y2="360" />
      <line x1="1040" y1="0" x2="1040" y2="360" />
      <line x1="1200" y1="0" x2="1200" y2="360" />
      <line x1="0" y1="60" x2="1280" y2="60" />
      <line x1="0" y1="120" x2="1280" y2="120" />
      <line x1="0" y1="180" x2="1280" y2="180" />
      <line x1="0" y1="240" x2="1280" y2="240" />
      <line x1="0" y1="300" x2="1280" y2="300" />
    </g>

    <!-- Animated Dynamic Conversational Audio Wave -->
    <g opacity="0.22" class="anim-wave">
      <path d="M 0 310 Q 80 270 160 310 T 320 310 T 480 310 T 640 310 T 800 310 T 960 310 T 1120 310 T 1280 310 T 1440 310 T 1600 310 T 1760 310 T 1920 310" 
            fill="none" stroke="#38bdf8" stroke-width="2.5" />
      <path d="M 0 320 Q 80 285 160 320 T 320 320 T 480 320 T 640 320 T 800 320 T 960 320 T 1120 320 T 1280 320 T 1440 320 T 1600 320 T 1760 320 T 1920 320" 
            fill="none" stroke="#a855f7" stroke-width="1.8" />
    </g>

    <!-- Network Nodes & Constellation -->
    <g stroke="#38bdf8" stroke-width="1" opacity="0.35">
      <line x1="110" y1="70" x2="180" y2="130" />
      <line x1="180" y1="130" x2="130" y2="200" />
      <line x1="1150" y1="80" x2="1190" y2="140" />
      <line x1="1190" y1="140" x2="1120" y2="220" />
    </g>
    <circle cx="110" cy="70" r="3" fill="#38bdf8" class="anim-node" />
    <circle cx="180" cy="130" r="4" fill="#818cf8" class="anim-node" style="animation-delay: 1s;" />
    <circle cx="130" cy="200" r="3" fill="#c084fc" class="anim-node" style="animation-delay: 2s;" />
    <circle cx="1150" cy="80" r="3" fill="#38bdf8" class="anim-node" style="animation-delay: 0.5s;" />
    <circle cx="1190" cy="140" r="4" fill="#a855f7" class="anim-node" style="animation-delay: 1.5s;" />
    <circle cx="1120" cy="220" r="3.5" fill="#38bdf8" class="anim-node" style="animation-delay: 2.2s;" />
  </g>

  <!-- FOREGROUND CONTENT CARD (Ensures high contrast, clarity, and readability) -->
  <g id="foreground-content" class="font-sans">
    <!-- Top Pill / Badge -->
    <g transform="translate(640, 52)">
      <rect x="-180" y="-16" width="360" height="32" rx="16" fill="rgba(30, 41, 59, 0.85)" stroke="#38bdf8" stroke-width="1.2" />
      <circle cx="-152" cy="0" r="4.5" fill="#10b981" />
      <text x="-136" y="5" fill="#e2e8f0" font-size="12" font-weight="700" letter-spacing="1.5">CURATED AWESOME ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="640" y="135" text-anchor="middle" font-size="46" font-weight="800" fill="url(#primaryTextGrad)" filter="url(#subtleGlow)" letter-spacing="-0.5">
      Awesome Virtual Agent
    </text>

    <!-- Subtitle -->
    <text x="640" y="178" text-anchor="middle" font-size="17" font-weight="400" fill="#cbd5e1" letter-spacing="0.2">
      Enterprise SaaS Platforms • Self-Hosted Open-Source • Conversational &amp; Agentic AI
    </text>

    <!-- Highlights Badges / Feature Pills in Foreground -->
    <g transform="translate(640, 245)">
      <!-- Pill 1: Conversational AI -->
      <g transform="translate(-450, 0)">
        <rect x="0" y="0" width="200" height="42" rx="21" fill="rgba(15, 23, 42, 0.8)" stroke="#38bdf8" stroke-width="1.2" />
        <text x="100" y="26" text-anchor="middle" fill="#f8fafc" font-size="13.5" font-weight="600">🤖 Conversational AI</text>
      </g>

      <!-- Pill 2: Agentic Workflows -->
      <g transform="translate(-230, 0)">
        <rect x="0" y="0" width="210" height="42" rx="21" fill="rgba(15, 23, 42, 0.8)" stroke="#818cf8" stroke-width="1.2" />
        <text x="105" y="26" text-anchor="middle" fill="#f8fafc" font-size="13.5" font-weight="600">🧠 Autonomous Agents</text>
      </g>

      <!-- Pill 3: Omnichannel CX -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="205" height="42" rx="21" fill="rgba(15, 23, 42, 0.8)" stroke="#c084fc" stroke-width="1.2" />
        <text x="102" y="26" text-anchor="middle" fill="#f8fafc" font-size="13.5" font-weight="600">🌐 Omnichannel Support</text>
      </g>

      <!-- Pill 4: Open-Source -->
      <g transform="translate(225, 0)">
        <rect x="0" y="0" width="225" height="42" rx="21" fill="rgba(15, 23, 42, 0.8)" stroke="#34d399" stroke-width="1.2" />
        <text x="112" y="26" text-anchor="middle" fill="#f8fafc" font-size="13.5" font-weight="600">🔓 Self-Hosted &amp; Open Source</text>
      </g>
    </g>
  </g>
</svg>
